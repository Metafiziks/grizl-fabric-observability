<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Part IV autonomous social media engine banner</title>
  <desc id="desc">Editorial banner for a LinkedIn article about an autonomous social media engine for a Web3 music brand.</desc>
  <defs>
    <linearGradient id="socialBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18031f"/>
      <stop offset="0.42" stop-color="#4c0d5f"/>
      <stop offset="1" stop-color="#02131f"/>
    </linearGradient>
    <radialGradient id="socialGlow" cx="68%" cy="45%" r="52%">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#e879f9" stop-opacity="0.45"/>
      <stop offset="0.72" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="slashes" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M-6 48 L48 -6 M18 54 L54 18" stroke="#f5d0fe" stroke-width="2" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="url(#socialBg)"/>
  <rect width="1200" height="627" fill="url(#slashes)"/>
  <rect width="1200" height="627" fill="url(#socialGlow)"/>
  <g transform="translate(722 90)" filter="url(#neon)">
    <rect x="0" y="0" width="286" height="386" rx="38" fill="#090016" stroke="#f0abfc" stroke-width="4"/>
    <circle cx="143" cy="62" r="20" fill="#f0abfc"/>
    <rect x="54" y="110" width="178" height="30" rx="15" fill="#00d4ff"/>
    <rect x="54" y="162" width="178" height="30" rx="15" fill="#f0abfc"/>
    <rect x="54" y="214" width="178" height="30" rx="15" fill="#22c55e"/>
    <path d="M78 306 C112 262, 174 350, 214 292" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <text x="73" y="360" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="18">AUTO POSTING</text>
  </g>
  <g transform="translate(72 78)">
    <text x="0" y="0" fill="#f0abfc" font-family="Menlo, Consolas, monospace" font-size="24" letter-spacing="4">PART IV / AI AGENTS</text>
    <text x="0" y="112" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="70" letter-spacing="-3">I HANDED AN</text>
    <text x="0" y="190" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="70" letter-spacing="-3">AI AGENT THE</text>
    <text x="0" y="268" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="70" letter-spacing="-3">BRAND KEYS.</text>
    <text x="3" y="333" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="25">Autonomous content engine for a Web3 music brand.</text>
  </g>
  <g transform="translate(75 514)">
    <rect x="0" y="0" width="332" height="52" rx="26" fill="#f0abfc"/>
    <text x="30" y="35" fill="#18031f" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="800">AGENTS WITH KEYS</text>
  </g>
  <text x="1118" y="568" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="18" transform="rotate(-90 1118 568)">METAFIZIK</text>
</svg>
