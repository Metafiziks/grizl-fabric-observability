<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Part IV RAG memory banner</title>
  <desc id="desc">Editorial LinkedIn banner for an article about adding scoped memory to Azure, GCP, and AWS RAG agents.</desc>
  <defs>
    <linearGradient id="memBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10051f"/>
      <stop offset="0.45" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="memCore" cx="70%" cy="45%" r="58%">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#a78bfa" stop-opacity="0.48"/>
      <stop offset="0.78" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="nodes" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#f5d0fe" opacity="0.22"/>
      <path d="M4 4L56 56" stroke="#f5d0fe" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="url(#memBg)"/>
  <rect width="1200" height="627" fill="url(#nodes)"/>
  <rect width="1200" height="627" fill="url(#memCore)"/>
  <g transform="translate(716 90)" filter="url(#neon)">
    <circle cx="150" cy="168" r="112" fill="none" stroke="#f0abfc" stroke-width="5"/>
    <circle cx="150" cy="168" r="54" fill="#020617" stroke="#34d399" stroke-width="4"/>
    <circle cx="48" cy="104" r="34" fill="#f0abfc"/>
    <circle cx="256" cy="104" r="34" fill="#a78bfa"/>
    <circle cx="72" cy="268" r="34" fill="#34d399"/>
    <circle cx="236" cy="270" r="34" fill="#22d3ee"/>
    <path d="M75 118 L120 145 M225 118 L180 145 M99 252 L123 204 M215 252 L177 204" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <text x="104" y="174" fill="#f8fafc" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="800">MEMORY</text>
    <text x="-6" y="382" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="18">scoped memory, not source truth</text>
  </g>
  <g transform="translate(72 76)">
    <text x="0" y="0" fill="#f0abfc" font-family="Menlo, Consolas, monospace" font-size="24" letter-spacing="4">PART IV / RAG MEMORY</text>
    <text x="0" y="112" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="69" letter-spacing="-3">I GAVE THE</text>
    <text x="0" y="190" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="69" letter-spacing="-3">RAG AGENTS</text>
    <text x="0" y="268" fill="#fff7ed" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="69" letter-spacing="-3">MEMORY.</text>
    <text x="4" y="334" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="25">They remember things now. Somehow even more dangerous.</text>
  </g>
  <g transform="translate(75 514)">
    <rect x="0" y="0" width="375" height="52" rx="26" fill="#f0abfc"/>
    <text x="30" y="35" fill="#10051f" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="800">MEMORY MUST SHUT UP</text>
  </g>
  <text x="1118" y="568" fill="#f5d0fe" font-family="Menlo, Consolas, monospace" font-size="18" transform="rotate(-90 1118 568)">METAFIZIK</text>
</svg>
