<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Part III multicloud RAG banner</title>
  <desc id="desc">Editorial banner for a LinkedIn article comparing the same RAG agent across Azure, GCP, and AWS.</desc>
  <defs>
    <linearGradient id="ragBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131d"/>
      <stop offset="0.48" stop-color="#10204a"/>
      <stop offset="1" stop-color="#320d3d"/>
    </linearGradient>
    <radialGradient id="ragGlow" cx="52%" cy="50%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.38" stop-color="#8b5cf6" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e0f2fe" opacity="0.26"/>
    </pattern>
  </defs>
  <rect width="1200" height="627" fill="url(#ragBg)"/>
  <rect width="1200" height="627" fill="url(#dots)"/>
  <rect width="1200" height="627" fill="url(#ragGlow)"/>
  <g transform="translate(640 108)" filter="url(#softGlow)">
    <circle cx="150" cy="150" r="132" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="150" cy="150" r="86" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="150" cy="150" r="38" fill="#f8fafc"/>
    <circle cx="35" cy="95" r="42" fill="#0284c7"/>
    <circle cx="270" cy="95" r="42" fill="#f97316"/>
    <circle cx="150" cy="282" r="42" fill="#22c55e"/>
    <path d="M70 108 L150 150 L235 108 M150 188 L150 242" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <text x="16" y="102" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="800">AZ</text>
    <text x="246" y="102" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="800">AWS</text>
    <text x="132" y="289" fill="#052e16" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="800">GCP</text>
  </g>
  <g transform="translate(72 78)">
    <text x="0" y="0" fill="#22d3ee" font-family="Menlo, Consolas, monospace" font-size="24" letter-spacing="4">PART III / RAG AGENTS</text>
    <text x="0" y="112" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="68" letter-spacing="-3">SAME AGENT.</text>
    <text x="0" y="188" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="68" letter-spacing="-3">THREE CLOUDS.</text>
    <text x="0" y="264" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="68" letter-spacing="-3">THREE PERSONALITIES.</text>
    <text x="3" y="328" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="25">Azure, GCP, and AWS each had a different opinion.</text>
  </g>
  <g transform="translate(75 514)">
    <rect x="0" y="0" width="300" height="52" rx="26" fill="#22d3ee"/>
    <text x="30" y="35" fill="#06131d" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="800">MULTICLOUD RAG</text>
  </g>
  <text x="1118" y="568" fill="#cbd5e1" font-family="Menlo, Consolas, monospace" font-size="18" transform="rotate(-90 1118 568)">METAFIZIK</text>
</svg>
